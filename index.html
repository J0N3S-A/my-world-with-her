<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Dich</title>
    <style>
        :root {
            --neon-pink: #ff107a;
            --bg-dark: #050505;
            --bg-warm: #18000a;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 1.2s ease-in-out;
            touch-action: manipulation;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body.active {
            background-color: var(--bg-warm);
        }

        /* كانفاس خلفية النجوم والقلوب */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* النص الأساسي */
        #text-display {
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            font-weight: 300;
            margin-bottom: 50px;
            text-align: center;
            z-index: 10;
            color: #333333;
            transition: color 0.8s ease, font-weight 0.8s ease;
            letter-spacing: 1.5px;
            pointer-events: none;
            padding: 0 25px;
            text-shadow: none;
        }

        /* توهج ونبض النص عند التشغيل */
        body.active #text-display {
            color: #ffffff;
            font-weight: 600;
            animation: textHeartbeat 2.2s infinite ease-in-out;
        }

        @keyframes textHeartbeat {
            0%, 100% { 
                transform: scale(1); 
                text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink); 
            }
            50% { 
                transform: scale(1.04); 
                text-shadow: 0 0 15px var(--neon-pink), 0 0 30px var(--neon-pink), 0 0 60px var(--neon-pink), 0 0 80px var(--neon-pink); 
            }
        }

        /* تصميم زر السويتش */
        .switch {
            position: relative;
            display: inline-block;
            width: 76px;
            height: 40px;
            z-index: 10;
            cursor: pointer;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #121212;
            transition: all 0.4s ease;
            border-radius: 40px;
            border: 2px solid #282828;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 30px;
            width: 30px;
            left: 3px;
            bottom: 3px;
            background-color: #3a3a3a;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-radius: 50%;
        }

        /* حالة التشغيل للزر */
        input:checked + .slider {
            background-color: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
        }

        input:checked + .slider:before {
            transform: translateX(36px);
            background-color: #ffffff;
            box-shadow: 0 0 10px #ffffff;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <h1 id="text-display">Mein Leben ohne dich</h1>

    <label class="switch">
        <input type="checkbox" id="magicToggle">
        <span class="slider"></span>
    </label>

    <script>
        const toggle = document.getElementById('magicToggle');
        const body = document.body;
        const textDisplay = document.getElementById('text-display');
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let animationFrameId;
        const shapes = ['★', '💖', '✦', '❤', '✨'];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // فئة إنشاء النجوم والقلوب المتساقطة والمتطايرة
        class Particle {
            constructor(x, y, isBurst = false) {
                this.x = x !== undefined ? x : Math.random() * width;
                this.y = y !== undefined ? y : -20;
                this.char = shapes[Math.floor(Math.random() * shapes.length)];
                this.size = Math.random() * 18 + 14;
                this.isBurst = isBurst;

                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.02 + 0.015;
                } else {
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.vy = Math.random() * 2 + 1.2;
                    this.alpha = Math.random() * 0.7 + 0.3;
                    this.rot = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.03;
                }
            }

            update() {
                if (this.isBurst) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alpha -= this.decay;
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rot += this.rotSpeed;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.globalAlpha = Math.max(0, this.alpha);
                
                // توهج نيون ورورد
                ctx.shadowColor = '#ff107a';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ff107a';
                ctx.font = `${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.fillText(this.char, 0, 0);
                ctx.restore();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            if (toggle.checked) {
                // إضافة عناصر جديدة متساقطة استمراراً
                if (Math.random() < 0.3) {
                    particles.push(new Particle());
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    p.draw();

                    // حذف العناصر الخارجة عن الشاشة لتخفيف العبء
                    if (p.isBurst && p.alpha <= 0) {
                        particles.splice(i, 1);
                    } else if (!p.isBurst && p.y > height + 30) {
                        particles.splice(i, 1);
                    }
                }

                animationFrameId = requestAnimationFrame(animate);
            }
        }

        // الاستماع لتغيير السويتش
        toggle.addEventListener('change', function() {
            if (this.checked) {
                body.classList.add('active');
                textDisplay.textContent = "Mein Leben jetzt mit dir";
                particles = [];
                // توليد دفعة أولية فورية
                for (let i = 0; i < 25; i++) {
                    let p = new Particle();
                    p.y = Math.random() * height;
                    particles.push(p);
                }
                animate();
            } else {
                body.classList.remove('active');
                textDisplay.textContent = "Mein Leben ohne dich";
                cancelAnimationFrame(animationFrameId);
                ctx.clearRect(0, 0, width, height);
                particles = [];
            }
        });

        // التفاعل مع لمس الشاشة (Touch & Click)
        function handleTouch(e) {
            if (!toggle.checked) return;
            if (e.target.closest('.switch')) return;

            let posX = e.clientX;
            let posY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                posX = e.touches[0].clientX;
                posY = e.touches[0].clientY;
            }

            // إنشاء انفجار نجوم وقلوب من نقطة اللمس
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(posX, posY, true));
            }
        }

        window.addEventListener('pointerdown', handleTouch);
    </script>
</body>
</html>
