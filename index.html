<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Für Dich</title>
    <style>
        :root {
            --neon-pink: #ff107a;
            --bg-dark: #070707;
            --bg-warm: #17000a;
        }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 1.5s ease-in-out;
            overflow: hidden;
            color: #444; /* لون باهت في حالة الإطفاء */
        }

        body.active {
            background-color: var(--bg-warm);
        }

        #text-display {
            font-size: 2.8rem;
            font-weight: 300;
            margin-bottom: 50px;
            text-align: center;
            z-index: 10;
            transition: all 1.2s ease-in-out;
            letter-spacing: 2px;
        }

        /* توهج النص عند التشغيل */
        body.active #text-display {
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            font-weight: 600;
            transform: scale(1.05);
        }

        /* تصميم زر السويتش */
        .switch {
            position: relative;
            display: inline-block;
            width: 70px;
            height: 34px;
            z-index: 10;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #222;
            transition: .5s;
            border-radius: 34px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: #555;
            transition: .5s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* حركة ديناميكية ناعمة */
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink);
        }

        input:checked + .slider:before {
            transform: translateX(36px);
            background-color: #fff;
            box-shadow: 0 0 15px #fff;
        }

        /* حاوية النجوم */
        #stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease-in-out; /* ظهور تدريجي ناعم */
        }

        body.active #stars-container {
            opacity: 1;
        }

        .star {
            position: absolute;
            background-color: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--neon-pink), 0 0 25px var(--neon-pink);
            animation: twinkle linear infinite;
        }

        /* وميض النجوم الانسيابي والهادئ */
        @keyframes twinkle {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <h1 id="text-display">Mein Leben ohne dich</h1>

    <label class="switch">
        <input type="checkbox" id="magicToggle">
        <span class="slider"></span>
    </label>
  
    <script>
        const toggle = document.getElementById('magicToggle');
        const body = document.body;
        const textDisplay = document.getElementById('text-display');
        const starsContainer = document.getElementById('stars-container');

        // توليد النجوم برمجياً لتوزيعها بشكل عشوائي وجميل
        const numberOfStars = 80; // عدد مناسب لملء الشاشة بدون إزعاج بصري
        for (let i = 0; i < numberOfStars; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            
            // توزيع عشوائي للأماكن
            let topPos = Math.random() * 100;
            let leftPos = Math.random() * 100;
            star.style.top = topPos + 'vh';
            star.style.left = leftPos + 'vw';
            
            // أحجام متفاوتة قليلاً
            let size = Math.random() * 3 + 2; 
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            
            // توقيتات عشوائية للحركة لتبدو طبيعية وغير متزامنة (مريحة للعين)
            star.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
            star.style.animationDelay = (Math.random() * 2) + 's';
            
            starsContainer.appendChild(star);
        }

        // الاستماع لتغيير حالة الزر
        toggle.addEventListener('change', function() {
            if(this.checked) {
                body.classList.add('active');
                // تغيير النص مع إضافة تأثير التوهج
                textDisplay.textContent = "Mein Leben jetzt mit dir";
            } else {
                body.classList.remove('active');
                // العودة للحالة المظلمة
                textDisplay.textContent = "Mein Leben ohne dich";
            }
        });
    </script>
</body>
</html>
